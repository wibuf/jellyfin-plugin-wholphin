name: Create release

# Fork: a push to gooseflix releases the version in Directory.Build.props, once (the tag is made
# by the release). Releasing is bumping the version. A v* tag pushed by hand still works.
on:
  push:
    branches:
      - gooseflix
    tags:
      - v*

defaults:
  run:
    shell: bash

env:
  NAME: "Jellyfin.Plugin.Wholphin"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # Need the tags to build

      # Fork: the tag is v<Version from Directory.Build.props>; skip if that's already released.
      # Only commits on gooseflix are released; Scuffed's plugin manifest lists every release.
      - name: Decide the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch origin gooseflix
          git merge-base --is-ancestor "$GITHUB_SHA" origin/gooseflix || { echo "Not on gooseflix"; exit 1; }
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props | head -1)"
          fi
          echo "TAG_NAME=$TAG" >> "$GITHUB_ENV"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG is already released"
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi

      - name: Setup .NET
        if: env.SKIP != '1'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Build
        if: env.SKIP != '1'
        run: |
          dotnet publish "${{ env.NAME }}" --configuration Release

      - name: Zip
        if: env.SKIP != '1'
        run: |
          mkdir -p ./dist
          find "${{ env.NAME }}/bin/Release/net10.0/publish" -type f -name "*.dll" -print0 | xargs -0 zip -j "./dist/${{ env.NAME }}.zip"

      - name: Checksums
        if: env.SKIP != '1'
        run: |
          echo "Checksums:"
          sha256sum "./dist/${{ env.NAME }}.zip"
          md5sum "./dist/${{ env.NAME }}.zip"
          echo "MD5=$(md5sum "./dist/${{ env.NAME }}.zip" | cut -d' ' -f1)" >> "$GITHUB_ENV"
      - name: Create GitHub release
        if: env.SKIP != '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s globstar

          gh release create "${{ env.TAG_NAME }}" \
            --latest --title "${{ env.TAG_NAME }}" --target "$GITHUB_SHA" -n "md5: ${{ env.MD5 }}" \
            "./dist/${{ env.NAME }}.zip"
